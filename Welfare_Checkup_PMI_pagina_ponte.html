<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Welfare Check-up PMI</title>

<style>

:root{
  --brand-blue:#073B5C;
  --brand-blue-dark:#052E47;
  --brand-green:#35B44A;
  --brand-green-light:#EEF9F0;
  --brand-red:#C91F2B;
  --brand-red-light:#FFF1F2;
  --text:#173746;
  --muted:#667B85;
  --border:#D7E2E7;
  --background:#F5F8F9;
}

*{box-sizing:border-box}

body{
  font-family:Arial,sans-serif;
  background:var(--background);
  margin:0;
  color:var(--text);
}

.wrap{
  max-width:720px;
  margin:auto;
  padding:20px;
}

.brand-header{
  text-align:center;
  padding:4px 0 14px;
}

.brand-logo{
  width:210px;
  max-width:65%;
  height:auto;
  display:block;
  margin:0 auto 10px;
}

.brand-line{
  height:4px;
  width:72px;
  margin:0 auto;
  border-radius:4px;
  background:linear-gradient(90deg,var(--brand-green) 0 50%,var(--brand-red) 50% 100%);
}

.card{
  background:#fff;
  border-radius:18px;
  padding:28px;
  box-shadow:0 8px 30px rgba(7,59,92,.10);
  margin:14px 0;
  border:1px solid #E5ECEF;
}

h1{
  font-size:30px;
  margin:0 0 10px;
  color:var(--brand-blue);
}

h2{
  font-size:22px;
  color:var(--brand-blue);
}

.sub{
  color:var(--muted);
  line-height:1.5;
}

.progress{
  height:8px;
  background:#E7EEF1;
  border-radius:8px;
  overflow:hidden;
  margin:20px 0;
}

.bar{
  height:100%;
  width:0;
  background:linear-gradient(90deg,var(--brand-green),#55C85E);
  transition:width .2s ease;
}

label.option{
  display:block;
  padding:13px 15px;
  border:1px solid var(--border);
  border-radius:12px;
  margin:9px 0;
  cursor:pointer;
  transition:.15s ease;
}

label.option:hover{
  background:var(--brand-green-light);
  border-color:#8BCF96;
}

label.option:has(input:checked){
  background:var(--brand-green-light);
  border-color:var(--brand-green);
  box-shadow:0 0 0 2px rgba(53,180,74,.08);
}

input[type=text],
input[type=email],
input[type=tel],
select{
  width:100%;
  padding:13px;
  border:1px solid #CCD9DE;
  border-radius:10px;
  font-size:16px;
  margin:6px 0 14px;
  color:var(--text);
  background:#fff;
}

input:focus,select:focus{
  outline:none;
  border-color:var(--brand-blue);
  box-shadow:0 0 0 3px rgba(7,59,92,.10);
}

button{
  border:0;
  border-radius:12px;
  padding:14px 20px;
  background:var(--brand-blue);
  color:white;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  transition:.15s ease;
}

button:hover{background:var(--brand-blue-dark)}
button:active{transform:translateY(1px)}

button.secondary{
  background:#E9EFF2;
  color:var(--brand-blue);
}

button.secondary:hover{background:#DDE7EB}

.small{
  font-size:13px;
  color:#6B7B80;
}

.hidden{display:none}

.score{
  font-size:48px;
  font-weight:800;
  color:var(--brand-blue);
}

.badge{
  display:inline-block;
  padding:7px 11px;
  border-radius:20px;
  background:var(--brand-green-light);
  color:#247A32;
  font-weight:700;
  border:1px solid #BFE5C4;
}

#result .card{
  border-left:4px solid var(--brand-green);
}

@media(max-width:520px){
  .wrap{padding:14px}
  .card{padding:22px 18px}
  h1{font-size:27px}
  h2{font-size:20px}
  .brand-logo{width:185px}
}
</style>
</head>

<div class="card hidden" id="quiz">

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<div id="q"></div>

<div style="display:flex;justify-content:space-between;margin-top:20px">

<button class="secondary" id="back" onclick="prev()">
← Indietro
</button>

<button id="next" onclick="next()">
Avanti →
</button>

</div>

</div>


<div class="card hidden" id="result"></div>

</div>


<script>

const questions=[

{
key:"employees",
title:"1. Quanti dipendenti ha la tua azienda?",
type:"radio",
opts:[
"1–5",
"6–10",
"11–20",
"21–50",
"51–100",
"oltre 100"
]
},

{
key:"sector",
title:"2. In quale settore opera principalmente?",
type:"radio",
opts:[
"Industria",
"Commercio",
"Servizi",
"Edilizia",
"Professionale",
"IT / tecnologia",
"Logistica / trasporti",
"Altro"
]
},

{
key:"role",
title:"3. Qual è il tuo ruolo in azienda?",
type:"radio",
opts:[
"Titolare / socio",
"Amministratore",
"HR / Risorse Umane",
"Direttore",
"Amministrazione",
"Altro"
]
},

{
key:"benefits",
title:"4. Quali strumenti sono già presenti?",
type:"multi",
opts:[
"Buoni pasto",
"Welfare aziendale",
"Fondo pensione / previdenza complementare",
"Sanità integrativa",
"Polizze assicurative per dipendenti",
"Coperture per soci / figure chiave",
"Flexible benefits",
"Nessuno di questi"
]
},

{
key:"effectiveness",
title:"5. Come valuti oggi il sistema di benefit offerto ai dipendenti?",
type:"radio",
opts:[
"1 — Praticamente inesistente",
"2",
"3",
"4",
"5 — Molto strutturato"
]
},

{
key:"problems",
title:"6. Negli ultimi 12 mesi avete avuto difficoltà a:",
type:"multi",
opts:[
"Trovare personale qualificato",
"Trattenere i dipendenti più importanti",
"Aumentare la motivazione",
"Gestire il costo del personale",
"Differenziarvi rispetto ai concorrenti",
"Nessuna particolare difficoltà"
]
},

{
key:"goal",
title:"7. Quale obiettivo sarebbe oggi più interessante?",
type:"radio",
opts:[
"Ridurre il costo effettivo di alcuni benefit",
"Aumentare il valore percepito della retribuzione",
"Fidelizzare i dipendenti",
"Attrarre nuovi collaboratori",
"Migliorare il benessere dei dipendenti",
"Proteggere imprenditore, soci e figure chiave",
"Costruire un sistema previdenziale/sanitario",
"Non abbiamo esigenze particolari"
]
},

{
key:"evaluated",
title:"8. Hai mai valutato di introdurre o migliorare un piano welfare?",
type:"radio",
opts:[
"Sì, e lo stiamo valutando",
"Sì, ma non abbiamo ancora fatto nulla",
"Ne abbiamo sentito parlare",
"No",
"Non so esattamente come funziona"
]
},

{
key:"budget",
title:"9. Quale investimento annuo considereresti realistico?",
type:"radio",
opts:[
"Meno di €2.500",
"€2.500–5.000",
"€5.000–10.000",
"€10.000–25.000",
"Oltre €25.000",
"Non saprei / vorrei prima capire i vantaggi"
]
},

{
key:"interest",
title:"10. Quali aspetti del welfare aziendale ti interesserebbe approfondire?",
type:"multi",
opts:[
"Welfare aziendale",
"Buoni pasto",
"Previdenza complementare",
"Sanità integrativa",
"Protezione dei dipendenti",
"Protezione delle figure chiave (TCM / LTC / Key Man)",
"TFR / previdenza",
"Vorrei ricevere una simulazione personalizzata",
"Vorrei essere contattato per approfondire"
]
},

{
key:"topic",
title:"11. Quale argomento vorresti approfondire maggiormente?",
type:"radio",
opts:[
"Welfare aziendale",
"Buoni pasto",
"Previdenza complementare",
"Sanità integrativa",
"Protezione dei dipendenti",
"Protezione delle figure chiave",
"TFR / previdenza",
"Non saprei, vorrei una valutazione generale"
]
},

{
key:"contact",
title:"12. Vuoi ricevere una valutazione personalizzata?",
type:"radio",
opts:[
"Sì, vorrei essere ricontattato",
"No, desidero soltanto visualizzare il risultato"
]
}

];


let i=0;
let a={};


function start(){

document.getElementById("intro").classList.add("hidden");

document.getElementById("quiz").classList.remove("hidden");

render();

}


function render(){

const q=questions[i];

const box=document.getElementById("q");

let html=`<h2>${q.title}</h2>`;


if(q.type==="multi"){

q.opts.forEach((o,n)=>{

html+=`
<label class="option">

<input
type="checkbox"
value="${o}"
${a[q.key]?.includes(o)?"checked":""}
>

${o}

</label>
`;

});

}

else{

q.opts.forEach(o=>{

html+=`
<label class="option">

<input
type="radio"
name="x"
value="${o}"
${a[q.key]===o?"checked":""}
>

${o}

</label>
`;

});

}


box.innerHTML=html;


document.getElementById("bar").style.width=
((i+1)/questions.length*100)+"%";


document.getElementById("back").style.visibility=
i?"visible":"hidden";


document.getElementById("next").textContent=
i===questions.length-1
?"VEDI IL RISULTATO →"
:"Avanti →";

}


function save(){

const q=questions[i];


if(q.type==="multi"){

a[q.key]=
[...document.querySelectorAll('#q input:checked')]
.map(x=>x.value);

}

else{

let x=document.querySelector('#q input:checked');

if(!x)return false;

a[q.key]=x.value;

}

return true;

}


function next(){

if(!save()){

alert("Seleziona almeno una risposta per continuare.");

return;

}


if(i<questions.length-1){

i++;

render();

}

else{

result();

}

}


function prev(){

if(i){

save();

i--;

render();

}

}


function score(){

let s=0;


const emp={

"1–5":3,

"6–10":7,

"11–20":12,

"21–50":18,

"51–100":22,

"oltre 100":25

}[a.employees]||0;


s+=emp;


if(a.benefits?.includes("Welfare aziendale"))

s-=4;

else

s+=7;


if(a.benefits?.includes("Sanità integrativa"))

s-=2;

else

s+=5;


if(a.benefits?.includes("Fondo pensione / previdenza complementare"))

s-=2;

else

s+=5;


if(a.problems?.some(x=>x!=="Nessuna particolare difficoltà"))

s+=12;


if((a.interest||[]).includes("Vorrei essere contattato per approfondire"))

s+=25;

else if((a.interest||[]).includes("Vorrei ricevere una simulazione personalizzata"))

s+=20;


if((a.interest||[]).length>=2)

s+=5;


if(a.contact==="Sì, vorrei essere ricontattato")

s+=10;


return Math.max(0,Math.min(100,s));

}


function result(){

let s=score();

let level=
s>=80?"ALTO":
s>=60?"BUONO":
s>=40?"POTENZIALE":
"BASSO";


let topics=[];


if(!a.benefits?.includes("Welfare aziendale"))

topics.push("Welfare aziendale");


if(!a.benefits?.includes("Fondo pensione / previdenza complementare"))

topics.push("Previdenza");


if(!a.benefits?.includes("Sanità integrativa"))

topics.push("Sanità integrativa");


if(a.goal?.includes("Proteggere"))

topics.push("Protezione figure chiave");


document.getElementById("quiz").classList.add("hidden");

document.getElementById("result").classList.remove("hidden");


document.getElementById("result").innerHTML=`

<h1>Il tuo Welfare Check-up</h1>

<div class="score">
${s}/100
</div>

<span class="badge">
Potenziale ${level}
</span>

<p class="sub">

Dalle tue risposte emergono alcune aree
che potrebbero meritare un approfondimento.

</p>

<h2>
Le aree da valutare
</h2>

<ul>

${topics.slice(0,3).map(x=>`<li>${x}</li>`).join("")}

</ul>

<p>

<b>
Vuoi capire concretamente cosa potrebbe essere applicato alla tua azienda?
</b>

</p>

${
a.contact==="Sì, vorrei essere ricontattato"

?

`<div class="card" style="padding:18px">

<h2>
Richiedi la tua analisi personalizzata
</h2>

<label>
Nome e cognome

<input id="name" type="text">

</label>


<label>
Azienda

<input id="company" type="text">

</label>


<label>
Email

<input id="email" type="email">

</label>


<label>
Telefono / WhatsApp

<input id="phone" type="tel">

</label>


<button onclick="submitLead()">

INVIA RICHIESTA →

</button>


<p class="small">

I dati saranno utilizzati per ricontattarti
in relazione alla richiesta effettuata,
secondo l'informativa privacy del titolare.

</p>

</div>`

:

"<p class='small'>Grazie per aver completato il check-up.</p>"

}

`;

}


function submitLead(){

const lead={

...a,

name:document.getElementById("name").value,

company:document.getElementById("company").value,

email:document.getElementById("email").value,

phone:document.getElementById("phone").value,

score:score(),

created_at:new Date().toISOString()

};


if(
!lead.name ||
!lead.company ||
!lead.email ||
!lead.phone
){

alert(
"Compila nome, azienda, email e telefono."
);

return;

}


document.querySelector("#result button").disabled=true;


// Invio dati in background: la pagina NON naviga verso Apps Script
fetch("https://script.google.com/macros/s/AKfycbzwGFGfRU9PYtsaqc6qZh_e3rMA7XXo0iFkY7MT8wL-sBLMQes8rXMH8YQzz14vqDIN/exec", {
  method: "POST",
  mode: "no-cors",
  headers: {
    "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8"
  },
  body: "payload=" + encodeURIComponent(JSON.stringify(lead))
}).catch(() => {
  // Il Web App può rispondere senza rendere leggibile la risposta cross-origin.
  // L'importante è che la richiesta POST venga inviata senza cambiare pagina.
});

document.getElementById("result").innerHTML =
"<h1>Richiesta ricevuta ✅</h1>" +
"<p class='sub'>Grazie. Verrai ricontattato per l'analisi personalizzata.</p>";

}

</script>

</body>
</html>
